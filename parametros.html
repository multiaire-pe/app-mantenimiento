<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Toma de parámetros</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);--fg:var(--tg-theme-text-color,#1a1a1a);--hint:var(--tg-theme-hint-color,#6b7280);
  --card:var(--tg-theme-secondary-bg-color,#f3f4f6);--btn:var(--tg-theme-button-color,#2563eb);--btnfg:var(--tg-theme-button-text-color,#fff);
  --err:#dc2626;--ok:#16a34a;--line:rgba(127,127,127,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:12px 14px 96px;min-height:100vh}
h1{font-size:18px;margin:0}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);margin:22px 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sub{color:var(--hint);font-size:13px}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--card);font-size:13px}
.pill.warn{background:#fef3c7;color:#92400e}
.pill.ok{background:#dcfce7;color:#166534}
label{display:block;font-size:13px;color:var(--hint);margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
input[readonly]{background:var(--card);color:var(--hint)}
textarea{min-height:110px;resize:vertical}
.err input,.err select,.err textarea,.err .seg{border-color:var(--err)}
.msg-err{color:var(--err);font-size:12px;margin-top:3px;display:none}
.err .msg-err{display:block}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card b{display:block}
.card small{color:var(--hint)}
.done{color:var(--ok);font-size:13px;white-space:nowrap}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.num{display:flex;gap:8px;align-items:center}
.num input{flex:1}
.na{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--hint);white-space:nowrap;margin:0}
.na input{width:22px;height:22px;padding:0;margin:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.seg label{flex:1;margin:0;text-align:center;padding:12px 6px;color:var(--fg);font-size:15px;cursor:pointer}
.seg input:checked+label{background:var(--btn);color:var(--btnfg)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px}
button{font:inherit;border:0;border-radius:12px;padding:14px;cursor:pointer}
button.main{flex:2;background:var(--btn);color:var(--btnfg);font-weight:600}
button.sec{flex:1;background:var(--card);color:var(--fg)}
button:disabled{opacity:.5}
.toast{position:fixed;left:14px;right:14px;top:12px;padding:12px 14px;border-radius:12px;background:#111;color:#fff;z-index:9;display:none}
.vacio{color:var(--hint);text-align:center;padding:28px 8px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="app"></div>

<script>
'use strict';
const tg = window.Telegram && window.Telegram.WebApp;
const API = '/api/parametros';
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* sin almacenamiento: sigue funcionando sin cola local */ } },
};
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const hoyLima = () => new Date(Date.now() - 5 * 3600e3).toISOString().slice(0, 10);

let tecnico = null, sedes = [], sedeSel = LS.get('par_sede', ''), equipos = [], filtro = '';
let enviando = false;
// ?demo=1 → vista previa: se recorre y se valida todo igual, pero NO se guarda ni se envía nada.
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
const bannerDemo = () => (DEMO ? '<div class="pill warn" style="display:block;margin:0 0 10px">🧪 Vista previa — no se guarda nada</div>' : '');

// ── comunicación ────────────────────────────────────────────────────────────────────────────
class ErrorApi extends Error { constructor(status, msg) { super(msg); this.status = status; } }
async function api(accion, extra = {}) {
  let res;
  try {
    res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'tma ' + tg.initData },
      body: JSON.stringify({ accion, ...extra }),
    });
  } catch { throw new ErrorApi(0, 'Sin conexión'); }
  let json = {};
  try { json = await res.json(); } catch { /* respuesta sin cuerpo */ }
  if (!res.ok) throw new ErrorApi(res.status, json.error || ('Error ' + res.status));
  return json;
}

// ── cola de envío (lo que no se pudo enviar queda en el teléfono) ────────────────────────────
const cola = () => LS.get('par_cola_v1', []);
const guardarCola = (c) => { LS.set('par_cola_v1', c); pintarPendientes(); if (tg) { c.length ? tg.enableClosingConfirmation() : tg.disableClosingConfirmation(); } };
const rechazados = () => LS.get('par_rech_v1', []);

async function enviarCola() {
  if (enviando) return;
  enviando = true;
  try {
    for (;;) {
      const c = cola();
      if (!c.length) break;
      const item = c[0];
      try {
        await api('guardar', { registro: item.registro });
        guardarCola(cola().filter((x) => x.registro.id !== item.registro.id));
        marcarHecho(item.registro.eqId);
      } catch (e) {
        if (e.status === 400) {   // el servidor lo rechazó de forma definitiva: se aparta para no trabar la cola
          LS.set('par_rech_v1', [...rechazados(), { ...item, error: e.message }]);
          guardarCola(cola().filter((x) => x.registro.id !== item.registro.id));
          aviso('⚠️ Un registro fue rechazado: ' + e.message);
          continue;
        }
        if (e.status === 401 || e.status === 403) aviso('⚠️ ' + e.message);
        break;   // sin conexión o error del servidor: se reintenta luego
      }
    }
  } finally { enviando = false; pintarPendientes(); if (!$('#form')) pintarLista(); }
}

const hechos = () => { const h = LS.get('par_hechos', {}); return h.fecha === hoyLima() ? h.ids : []; };
function marcarHecho(eqId) { const ids = new Set(hechos()); ids.add(eqId); LS.set('par_hechos', { fecha: hoyLima(), ids: [...ids] }); }

// ── interfaz ────────────────────────────────────────────────────────────────────────────────
let _t;
function aviso(txt) { const t = $('#toast'); t.textContent = txt; t.style.display = 'block'; clearTimeout(_t); _t = setTimeout(() => { t.style.display = 'none'; }, 3800); }

function pintarPendientes() {
  const el = $('#pend'); if (!el) return;
  const n = cola().length;
  el.innerHTML = n ? `<span class="pill warn">📤 ${n} por enviar</span>` : `<span class="pill ok">✅ Todo enviado</span>`;
}

function encabezado() {
  return bannerDemo() + `<div class="top"><div><h1>📊 Toma de parámetros</h1><div class="sub">Extractores e inyectores${tecnico ? ' · ' + esc(tecnico.nombre) : ''}</div></div><div id="pend"></div></div>`;
}

async function iniciar() {
  const app = $('#app');
  if (!tg || !tg.initData) {
    app.innerHTML = encabezado() + '<div class="vacio">Ábrelo desde el botón del bot de Telegram de MultiAire.</div>';
    return;
  }
  tg.ready(); tg.expand();
  app.innerHTML = encabezado() + '<div class="vacio">Cargando…</div>';
  pintarPendientes();
  try {
    const r = await api('inicio');
    tecnico = r.tecnico; sedes = r.sedes;
    LS.set('par_inicio', r);
  } catch (e) {
    const prev = LS.get('par_inicio', null);
    if (e.status === 0 && prev) { tecnico = prev.tecnico; sedes = prev.sedes; aviso('Sin conexión: usando la última lista cargada'); }
    else {
      app.innerHTML = encabezado() + `<div class="vacio">${esc(e.message)}<br><br><button class="main" id="reint">Reintentar</button></div>`;
      $('#reint').onclick = iniciar;
      return;
    }
  }
  if (!sedes.some((s) => `${s.cliente}|${s.sede}` === sedeSel)) sedeSel = sedes.length === 1 ? `${sedes[0].cliente}|${sedes[0].sede}` : '';
  pintarLista();
  if (sedeSel) await cargarEquipos();
  enviarCola();
}

function pintarLista() {
  const app = $('#app');
  const opts = sedes.map((s) => { const v = `${s.cliente}|${s.sede}`; return `<option value="${esc(v)}"${v === sedeSel ? ' selected' : ''}>${esc(s.cliente)} · ${esc(s.sede)} (${s.n})</option>`; }).join('');
  const hoy = new Set(hechos());
  const q = filtro.toLowerCase();
  const lista = equipos.filter((e) => !q || (e.nombre + ' ' + e.area).toLowerCase().includes(q));
  app.innerHTML = encabezado()
    + `<label>Sede</label><select id="sede"><option value="">— Elegir sede —</option>${opts}</select>`
    + (sedeSel ? `<label>Buscar equipo</label><input id="buscar" type="search" placeholder="Nombre o ubicación" value="${esc(filtro)}">` : '')
    + (sedeSel
      ? (lista.length ? lista.map((e) => `<div class="card" data-eq="${esc(e.eqId)}"><div><b>${esc(e.nombre)}</b><small>${esc(e.area) || 'Sin ubicación'}</small></div>${hoy.has(e.eqId) ? '<span class="done">✓ hoy</span>' : ''}</div>`).join('') : '<div class="vacio">No hay equipos que coincidan.</div>')
      : '<div class="vacio">Elige la sede para ver sus equipos.</div>');
  pintarPendientes();
  $('#sede').onchange = async (ev) => { sedeSel = ev.target.value; LS.set('par_sede', sedeSel); filtro = ''; equipos = []; pintarLista(); if (sedeSel) await cargarEquipos(); };
  const b = $('#buscar'); if (b) b.oninput = (ev) => { filtro = ev.target.value; const pos = ev.target.selectionStart; pintarLista(); const n = $('#buscar'); n.focus(); n.setSelectionRange(pos, pos); };
  document.querySelectorAll('.card').forEach((c) => { c.onclick = () => abrirForm(equipos.find((e) => e.eqId === c.dataset.eq)); });
}

async function cargarEquipos() {
  const [cliente, sede] = sedeSel.split('|');
  const clave = 'par_eq_' + sedeSel;
  try { equipos = (await api('equipos', { cliente, sede })).equipos; LS.set(clave, equipos); }
  catch (e) {
    const prev = LS.get(clave, null);
    if (prev) { equipos = prev; aviso('Sin conexión: usando la última lista de esta sede'); }
    else { aviso('No se pudieron cargar los equipos: ' + e.message); equipos = []; }
  }
  pintarLista();
}

// ── formulario ──────────────────────────────────────────────────────────────────────────────
const SEL = {
  estado: [['BUENO', 'Bueno'], ['REGULAR', 'Regular'], ['MALO', 'Malo'], ['NA', 'N/A']],
  filtros: [['BUENO', 'Bueno'], ['REGULAR', 'Regular'], ['MALO', 'Malo'], ['SIN_FILTRO', 'Sin filtro'], ['NA', 'N/A']],
  transmision: [['DIRECTA', 'Directa'], ['FAJAS', 'Por fajas'], ['ACOPLADA', 'Acoplada'], ['NA', 'N/A']],
};
const select = (id, rotulo, lista) => `<div data-campo="${id}"><label for="${id}">${rotulo}</label><select id="${id}"><option value="">— Elegir —</option>${lista.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select><div class="msg-err">Elige una opción</div></div>`;
const numero = (id, rotulo) => `<div data-campo="${id}" data-num="1"><label for="${id}">${rotulo}</label><div class="num"><input id="${id}" inputmode="decimal" autocomplete="off" placeholder="Valor"><label class="na"><input type="checkbox" id="${id}_na"> N/A</label></div><div class="msg-err">Escribe el valor o marca N/A</div></div>`;

function abrirForm(eq) {
  if (!eq) return;
  const app = $('#app');
  app.innerHTML = `<div id="form">
    ${bannerDemo()}<div class="top"><div><h1>${esc(eq.nombre)}</h1><div class="sub">${esc(eq.sede)} · ${esc(eq.area) || 'Sin ubicación'}</div></div><div id="pend"></div></div>

    <h2>1 · Información general</h2>
    <div class="sub">La fecha y la hora se registran al guardar. El técnico responsable es quien tiene la sesión de Telegram: <b>${esc(tecnico.nombre)}</b>.</div>
    <label for="supervisor">Supervisor a cargo</label><input id="supervisor" maxlength="80" value="${esc(LS.get('par_sup', ''))}" autocomplete="off">

    <h2>2 · Datos del equipo</h2>
    <div class="row"><div><label>TAG / Código</label><input value="${esc(eq.eqId)}" readonly></div><div><label>Tipo</label><input value="${esc(eq.tipo)}" readonly></div></div>
    <div class="row"><div><label for="marca">Marca</label><input id="marca" maxlength="60" value="${esc(eq.marca)}"></div><div><label for="modelo">Modelo</label><input id="modelo" maxlength="60" value="${esc(eq.modelo)}"></div></div>
    <div class="row"><div><label for="serie">Número de serie</label><input id="serie" maxlength="60" value="${esc(eq.serie)}"></div><div><label for="potencia">Potencia del motor (HP/kW)</label><input id="potencia" maxlength="40" value="${esc(eq.capacidad)}"></div></div>

    <h2>3 · Parámetros eléctricos</h2>
    <div data-campo="fases"><label>Fases</label><div class="seg"><input type="radio" name="fases" id="fases1" value="1PH"><label for="fases1">Monofásico (1PH)</label><input type="radio" name="fases" id="fases3" value="3PH"><label for="fases3">Trifásico (3PH)</label></div><div class="msg-err">Indica las fases</div></div>
    ${numero('voltajeNominal', 'Voltaje nominal (V)')}
    ${numero('amperajeNominal', 'Amperaje nominal (A)')}
    ${numero('frecuencia', 'Frecuencia (Hz)')}
    ${select('estadoTablero', 'Estado del tablero eléctrico', SEL.estado)}
    ${select('estadoContactores', 'Estado de contactores', SEL.estado)}
    ${numero('vL1L2', 'Voltaje medido L1-L2 (V)')}
    <div class="trif">${numero('vL2L3', 'Voltaje medido L2-L3 (V)')}${numero('vL1L3', 'Voltaje medido L1-L3 (V)')}</div>
    ${numero('aL1', 'Amperaje medido L1 (A)')}
    <div class="trif">${numero('aL2', 'Amperaje medido L2 (A)')}${numero('aL3', 'Amperaje medido L3 (A)')}</div>

    <h2>4 · Estado y condiciones del sistema</h2>
    ${select('transmision', 'Tipo de transmisión', SEL.transmision)}
    ${select('filtros', 'Estado de filtros', SEL.filtros)}
    ${select('fajas', 'Condición de fajas', SEL.estado)}
    <label for="fajasMedida">Medida de la faja (M)</label><input id="fajasMedida" maxlength="40" placeholder="Opcional (ej: A55)">
    ${select('poleas', 'Condición de poleas', SEL.estado)}

    <h2>5 · Observaciones y diagnóstico técnico</h2>
    <textarea id="observaciones" maxlength="1000" placeholder="Escribe lo que encontraste"></textarea>
  </div>
  <div class="bar"><button class="sec" id="volver">← Volver</button><button class="main" id="guardar">Guardar registro</button></div>`;
  pintarPendientes();
  const trif = () => { const tres = ($('input[name=fases]:checked') || {}).value === '3PH'; document.querySelectorAll('.trif').forEach((n) => n.classList.toggle('hidden', !tres)); };
  trif();
  document.querySelectorAll('input[name=fases]').forEach((r) => { r.onchange = trif; });
  // marcar N/A deja el campo numérico vacío y deshabilitado
  document.querySelectorAll('.na input').forEach((cb) => { cb.onchange = () => { const i = $('#' + cb.id.replace('_na', '')); i.disabled = cb.checked; if (cb.checked) i.value = ''; }; });
  $('#volver').onclick = () => { filtro = ''; pintarLista(); window.scrollTo(0, 0); };
  $('#guardar').onclick = () => guardar(eq);
  window.scrollTo(0, 0);
}

// "12,5" → 12.5 · 'NA' si está marcado N/A · null si falta
function leerNumero(id) {
  if ($('#' + id + '_na').checked) return 'NA';
  const t = $('#' + id).value.trim().replace(',', '.');
  if (t === '') return null;
  const n = Number(t);
  return Number.isFinite(n) && n >= 0 ? n : null;
}

function guardar(eq) {
  document.querySelectorAll('.err').forEach((n) => n.classList.remove('err'));
  const fases = ($('input[name=fases]:checked') || {}).value || '';
  const tres = fases === '3PH';
  const faltan = [];
  const marcar = (campo) => { const n = $(`[data-campo="${campo}"]`); if (n) n.classList.add('err'); faltan.push(campo); };
  if (!fases) marcar('fases');
  const el = { fases };
  for (const k of ['voltajeNominal', 'amperajeNominal', 'frecuencia', 'vL1L2', 'aL1', ...(tres ? ['vL2L3', 'vL1L3', 'aL2', 'aL3'] : [])]) {
    const v = leerNumero(k); if (v === null) marcar(k); else el[k] = v;
  }
  for (const k of ['estadoTablero', 'estadoContactores']) { const v = $('#' + k).value; if (!v) marcar(k); else el[k] = v; }
  const si = {};
  for (const k of ['transmision', 'filtros', 'fajas', 'poleas']) { const v = $('#' + k).value; if (!v) marcar(k); else si[k] = v; }
  si.fajasMedida = $('#fajasMedida').value.trim();
  if (faltan.length) {
    aviso('Faltan datos por completar (en rojo).');
    const primero = $(`[data-campo="${faltan[0]}"]`); if (primero) primero.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  if (DEMO) {   // vista previa: pasó la validación, pero no se guarda ni se envía
    aviso('🧪 Vista previa: el formulario está completo. No se guardó nada.');
    filtro = ''; pintarLista(); window.scrollTo(0, 0);
    return;
  }
  const sup = $('#supervisor').value.trim();
  LS.set('par_sup', sup);
  const registro = {
    id: 'PAR-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
    eqId: eq.eqId,
    capturadoEn: new Date().toISOString(),
    supervisor: sup,
    equipo: { marca: $('#marca').value.trim(), modelo: $('#modelo').value.trim(), serie: $('#serie').value.trim(), potencia: $('#potencia').value.trim() },
    electrico: el, sistema: si,
    observaciones: $('#observaciones').value.trim(),
  };
  guardarCola([...cola(), { registro, ts: Date.now() }]);
  $('#guardar').disabled = true;
  enviarCola().then(() => {
    const pendiente = cola().some((x) => x.registro.id === registro.id);
    aviso(pendiente ? '📶 Guardado en el teléfono. Se enviará cuando haya internet.' : '✅ Registro guardado');
  });
  filtro = '';
  pintarLista();
  window.scrollTo(0, 0);
}

// Reintentos automáticos: al volver la señal, al abrir y cada 15 s mientras haya algo pendiente.
window.addEventListener('online', enviarCola);
setInterval(() => { if (cola().length) enviarCola(); }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && cola().length) enviarCola(); });
iniciar();
</script>
</body>
</html>
